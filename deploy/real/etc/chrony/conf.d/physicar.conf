# Pi 5 has no RTC battery: after a power cut the clock starts in the past. Ubuntu
# 26.04's default pools are NTS-only (TLS), and that handshake rejects every
# certificate as "not yet valid" with a wrong clock, so the robot never synced and
# every TLS use (Open VSX, Let's Encrypt, apt, pip, the AI API) kept failing
# (measured 2026-10-18: 5 min unsynced; synced 10 s after this line).
# Skip the certificate time check until the clock has been set once.
nocerttimecheck 1

# Some uplinks pass only the classic 48-byte NTP packet on UDP/123 and silently
# drop anything bigger (NTP-amplification filters in routers, APs and ISPs).
# NTS requests and replies are 200-600 bytes, so behind such a filter Ubuntu's
# NTS-only pools never get an answer and the clock stays wrong for the whole
# boot (measured 2026-10-28 on an office Wi-Fi uplink: 48 B answered, 200 B and
# up dropped, Ubuntu and Cloudflare alike; HTTPS to the AI API dead for 15 min).
# Plain NTP as a fallback. Ubuntu marks its NTS pools "prefer", so they still
# win whenever they answer. The default "mix" selection would put "require" on
# the NTS sources and never pick the fallback, and "prefer" would mark the
# fallback "noselect", hence "ignore". (ntp.ubuntu.com shares the NTS pools'
# addresses, so other pools are used here.)
authselectmode ignore
pool pool.ntp.org iburst maxsources 3
server time.cloudflare.com iburst
