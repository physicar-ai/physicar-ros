[supervisord]
nodaemon=false
; Keep Python bytecode caches out of the workspace — no __pycache__ in student
; folders, and the watchdog reloader stops reacting to cache-file creation.
; /opt (not /tmp): pre-warmed at image build and survives instance restarts,
; so first boot doesn't pay the bytecode-compile cost again.
environment=PYTHONPYCACHEPREFIX="/opt/physicar/pycache"
logfile=/tmp/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=/tmp/supervisord.pid
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:xvfb]
command=Xvfb :1 -screen 0 800x600x24 -ac +extension GLX +render -noreset
autorestart=true
priority=200
stdout_logfile=/dev/null
stderr_logfile=/dev/null
redirect_stderr=true

[program:openbox]
command=openbox
environment=DISPLAY=":1"
autorestart=true
priority=210
depends_on=xvfb
stdout_logfile=/dev/null
stderr_logfile=/dev/null
redirect_stderr=true

[program:wallpaper]
# the VNC desktop's background (deploy/vnc/wallpaper.png) — painted once openbox is up, exits
command=/bin/bash /opt/physicar/src/physicar-ros/deploy/vnc/set-wallpaper.sh
environment=DISPLAY=":1"
autorestart=false
startsecs=0
priority=212
depends_on=openbox
stdout_logfile=/dev/null
stderr_logfile=/dev/null
redirect_stderr=true

[program:tint2]
command=tint2
environment=DISPLAY=":1"
autorestart=true
priority=215
depends_on=openbox
stdout_logfile=/dev/null
stderr_logfile=/dev/null
redirect_stderr=true

[program:x11vnc]
command=x11vnc -display :1 -forever -nopw -shared -rfbport 5901
autorestart=true
priority=220
depends_on=xvfb
stdout_logfile=/dev/null
stderr_logfile=/dev/null
redirect_stderr=true

[program:novnc]
command=/usr/share/novnc/utils/novnc_proxy --vnc localhost:5901 --listen 6080 --heartbeat 30
autorestart=true
priority=230
depends_on=x11vnc
stdout_logfile=/dev/null
stderr_logfile=/dev/null
redirect_stderr=true

[program:nginx]
command=sudo nginx -g "daemon off;"
autorestart=true
priority=300
stdout_logfile=/dev/null
stderr_logfile=/dev/null
redirect_stderr=true

[program:code-server]
# Serves `/` (nginx proxies the root to it — see the entrypoint.sh root
# snippet).
# The wrapper remaps a clean exit to 86 so autorestart=unexpected revives
# it: a clean code-server exit (observed on real hardware, exit 0, cause
# unknown) would otherwise leave `/` on a permanent 502.
# TERM is forwarded to the child so supervisorctl stop still works.
command=/bin/bash -c "code-server --bind-addr 127.0.0.1:8080 --auth none --disable-telemetry --disable-update-check /home/physicar/physicar_ws & c=$!; trap 'kill -TERM $c 2>/dev/null' TERM INT; wait $c; ec=$?; [ \"$ec\" = 0 ] && exit 86; exit $ec"
user=physicar
environment=HOME="/home/physicar"
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
priority=310
stdout_logfile=/tmp/code-server.log
stderr_logfile=/tmp/code-server.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=0
redirect_stderr=true

[program:physicar]
command=/bin/bash -c "/opt/physicar/src/physicar-ros/deploy/sim/physicar.sh"
autostart=true
autorestart=false
startsecs=0
priority=650
killasgroup=true
stopasgroup=true
stdout_logfile=/opt/physicar/userdata/physicar.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=0
stderr_logfile=/opt/physicar/userdata/physicar.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=0

[program:startup]
# The startup script — /opt/physicar/userdata/startup.sh, the user's own commands
# that run once the stack is up (typically the command that launches their app on
# port 5000; the panel's System tab edits it, shows startup.log and restarts it).
# Run from the workspace root so relative paths resolve there. The shell writes
# startup.log itself (truncated on every start, same as the real unit). An empty
# script exits 0 at once: EXITED is its idle state (exit 0 is not restarted).
# entrypoint.sh creates the file empty, physicar-owned, before supervisord starts.
command=/bin/bash -ic "[ -f /opt/physicar/userdata/startup.sh ] || exit 0; exec bash /opt/physicar/userdata/startup.sh > /opt/physicar/userdata/startup.log 2>&1"
directory=/home/physicar/physicar_ws
environment=PORT="5000",PYTHONUNBUFFERED="1"
autostart=true
autorestart=unexpected
startsecs=0
# stop/kill the whole process group: a script that launches its app without
# `exec` must not leave the app behind holding port 5000
stopasgroup=true
killasgroup=true
priority=700
