<!DOCTYPE html>
<html lang="ko">
<head>
<script>
  /* PhysiCar extension handshake: tells the wrapper webview this page actually
     rendered. Sent only AFTER the window load event AND a sanity check that
     core.js really executed — right after a Codespace (re)start nginx serves
     /app while FastAPI is still booting, so the document can load with its
     CSS/JS missing. A broken render must NOT be confirmed to the wrapper;
     without the handshake it keeps its spinner and reloads the iframe (~8s)
     until the page comes up healthy. No-op when not embedded. */
  window.addEventListener("load", function () {
    if (typeof detectMode !== "function") return;   // core.js missing → not healthy
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "physicar-app-ready" }, "*");
      }
    } catch (e) { /* not embedded -- ignore */ }
  });

  /* ── PhysiCar session token sharing (physicar-ext bridge) ──
     When the extension pushes the Chat-login session token (pushToken →
     "physicar-token"), it is planted as the "physicar_session" COOKIE. Why a
     cookie:
      - It rides automatically on every same-origin request (new tabs, iframes,
        WS handshakes), so student backends just read request.cookies —
        zero-code token delivery, per browser = per user.
      - localStorage written inside the webview iframe is storage-partitioned
        away from top-level tabs, but cookies are shared (the nginx pc_token
        gate proves this in practice).
     In the iframe (third-party context, always an https tunnel) SameSite=None;
     Secure is mandatory. Also mirrored to sessionStorage (NOT localStorage —
     a persistent mirror would outlive the session cookie and leak the previous
     user's token on shared PCs) as a fallback for JS in the same partition
     (physicarSession helper). Sign-out (clear) propagates.
     Outside the webview (plain tab) there is no parent — silently a no-op. */
  (function () {
    var SESSION_KEY = "physicar_session";
    // Always a session cookie (no Max-Age — gone when the browser closes).
    // Not persisted on purpose: on a shared PC a previous user's token
    // lingering on /myapp for days outweighs the rare convenience of
    // "reopen myapp directly after a browser restart". Opening the
    // workspace/app makes the panel (bridge) replant the cookie anyway.
    function setCookie(token) {
      var attrs = "; Path=/"
        + (location.protocol === "https:" ? "; SameSite=None; Secure" : "; SameSite=Lax");
      try { document.cookie = SESSION_KEY + "=" + encodeURIComponent(token) + attrs; } catch (_) {}
    }
    function clearCookie() {
      var attrs = "; Path=/; Max-Age=0"
        + (location.protocol === "https:" ? "; SameSite=None; Secure" : "; SameSite=Lax");
      try { document.cookie = SESSION_KEY + "=" + attrs; } catch (_) {}
    }
    window.addEventListener("message", function (e) {
      var msg = e.data || {};
      if (msg.type === "physicar-token" && typeof msg.token === "string" && msg.token) {
        setCookie(msg.token);
        try { sessionStorage.setItem(SESSION_KEY, msg.token); } catch (_) {}
        try { localStorage.removeItem(SESSION_KEY); } catch (_) {}  /* clear legacy persistent mirror */
      } else if (msg.type === "physicar-token-clear") {
        clearCookie();
        try { sessionStorage.removeItem(SESSION_KEY); } catch (_) {}
        try { localStorage.removeItem(SESSION_KEY); } catch (_) {}
      }
    });
    try {
      if (window.parent !== window) {
        // always request so a stored token gets refreshed (no reply if chat is closed)
        window.parent.postMessage({ type: "physicar-token-request" }, "*");
      }
    } catch (_) {}

    /* Cloud sim auto-login: on sim.physicar.ai the gateway's own cookie already
       identifies the user — exchange it for an API session via same-origin
       /__session when we hold no token (standalone tab; the extension bridge
       covers the embedded case). Elsewhere the endpoint doesn't exist →
       non-OK/throw → silently ignored. */
    try {
      var _have = null;
      try {
        _have = /(?:^|;\s*)physicar_session=/.test(document.cookie)
          ? "cookie" : sessionStorage.getItem(SESSION_KEY);
      } catch (_) {}
      if (!_have) {
        fetch("/__session", { method: "POST" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) {
            if (d && d.token) {
              setCookie(d.token);
              try { sessionStorage.setItem(SESSION_KEY, d.token); } catch (_) {}
            }
          })
          .catch(function () {});
      }
    } catch (_) {}
  })();
</script>
<script>
  /* Boot race guard: right after a Codespace (re)start, github.dev port auth
     can 302 CSS/JS subresources to pf-signin while the document itself loads,
     leaving an unstyled page. If any stylesheet/script fails to load, reload
     once auth settles (max 5 attempts, backed off; counter resets on success). */
  (function () {
    var KEY = 'pc-asset-reload';
    window.addEventListener('error', function (e) {
      var t = e.target || {};
      if (t.tagName !== 'LINK' && t.tagName !== 'SCRIPT') return;
      var n = +(sessionStorage.getItem(KEY) || 0);
      if (n >= 5 || window.__pcReloading) return;
      window.__pcReloading = true;
      sessionStorage.setItem(KEY, String(n + 1));
      setTimeout(function () { location.reload(); }, 2000 * (n + 1));
    }, true);
    window.addEventListener('load', function () {
      if (!window.__pcReloading) sessionStorage.removeItem(KEY);
    });
  }());
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHYSICAR App</title>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/control.css">
<style>
/* ── /app layout — 3열 (경계 2개 모두 드래그 리사이즈, 세션 한정):
   ┌────────┬───────────────────┬──────────────┐
   │        │ CONTROL (상단 고정) │              │
   │ 상태    ├───── ↕ 경계 ──────┤ 시뮬레이터    │
   │ 패널    │ 앱 (My App/VNC    │ (/sim, sim   │
   │        │  필 버튼 전환)      │  모드 전용)   │
   └────────┴───────────────────┴──────────────┘ */
body{display:flex;flex-direction:row;height:100vh}

/* main : sensors = 5 : 2 by default (drag-adjustable, session only) */
.main{display:flex;flex-direction:column;min-width:0}

/* Column: CONTROL card (height drag-adjustable via the horizontal divider)
   + ONE app card that always fills the leftover height. No stack scroll. */
.stack{
  flex:1;min-height:0;overflow:hidden;
  display:flex;flex-direction:column;
}
/* 카드 장식 없음 — CONTROL/APP은 플랫 섹션, 사이는 가로 경계선이 가른다 */
.stack-panel{
  display:none;flex-direction:column;min-height:0;
  background:#111;overflow:hidden;
}
.stack-panel.on{display:flex}
/* CONTROL height follows its content (pads sized from column width);
   APP takes everything left. */
#panel-control{background:var(--bg);flex:0 0 auto}
#panel-myapp,#panel-vnc{flex:1 1 0;min-height:120px;border-top:1px solid var(--border)}

/* Slim identity strip on every panel */
.sp-head{
  height:24px;flex-shrink:0;display:flex;align-items:center;gap:8px;
  padding:0 10px;font-size:10px;font-weight:700;letter-spacing:.08em;
  color:var(--fg3);background:var(--bg2);border-bottom:1px solid var(--border);
  cursor:pointer;user-select:none;
}

/* Panel body fills whatever height the card gets */
.sp-body{position:relative;width:100%;flex:1;min-height:0}
.sp-body iframe{position:absolute;inset:0;width:100%;height:100%;border:none;background:#111}
.sp-actions{margin-left:auto;display:flex;gap:2px;align-items:center}
.sp-btn{
  display:flex;align-items:center;justify-content:center;
  width:20px;height:20px;border-radius:5px;color:var(--fg2);
}
.sp-btn:hover{background:var(--bg3);color:var(--fg)}
.sp-btn svg{width:13px;height:13px}

/* Simulator column (sim mode only — real robots have no /sim). Own header
   carries the current-world chip; the embedded /sim hides its toolbar copy. */
#simcol{display:none;min-width:0;flex-shrink:0;background:#111}
body.sim-mode #simcol{display:flex;flex-direction:column}
body:not(.sim-mode) #divider2{display:none}
#simcol .sim-body{position:relative;flex:1;min-height:0}
#simcol iframe{position:absolute;inset:0;width:100%;height:100%;border:none;background:#111}
/* World chip: must read as an interactive select at a glance — raised body
   (gradient + shadow), visible border, bright caret, hover/press feedback.
   No centering ghost — it starved the name of width. */
#sim-world-btn{margin:0 auto;padding:3px 24px 3px 10px;border-radius:5px;font-size:11px;
  font-weight:600;color:var(--fg);background:linear-gradient(#2c3140, #232734);
  border:1px solid var(--fg3);
  cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  min-width:110px;max-width:min(280px,100%);position:relative;text-align:center;
  box-shadow:0 1px 3px rgba(0,0,0,.4);
  transition:border-color .15s, background .15s}
#sim-world-btn::after{content:'\25be';position:absolute;right:8px;top:50%;
  transform:translateY(-50%);color:var(--fg);font-size:16px;line-height:1}
#sim-world-btn:hover{border-color:var(--accent);background:#323748}
#sim-world-btn:hover::after{color:var(--accent)}
#sim-world-btn:active{background:#232734;box-shadow:none}

/* World modal — same full-cover treatment as the sensor zoom modal */
#world-modal .sensor-modal{width:min(440px,92vw)}
.wm-body{overflow-y:auto;flex:1;padding:4px 0;max-height:calc(95vh - 140px)}
.wm-sec{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--fg3);padding:8px 14px 3px}
.wm-row{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;font-size:13px}
.wm-row:hover{background:var(--bg3)}
.wm-row.active{color:#4ade80}
.wm-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wm-del{color:var(--fg3);padding:2px 4px;border-radius:4px;flex-shrink:0;line-height:1}
.wm-del:hover{color:#f87171;background:rgba(248,113,113,.15)}
.wm-confirm{display:flex;align-items:center;gap:5px;flex-shrink:0;font-size:11px;color:#f87171}
.wm-confirm button{border:1px solid var(--border);background:var(--bg3);color:var(--fg);
  border-radius:4px;padding:1px 8px;cursor:pointer;font-size:11px}
.wm-confirm .wm-yes:hover{background:#7f1d1d;border-color:#f87171}
.wm-confirm .wm-no:hover{background:var(--bg2)}
.wm-empty{color:var(--fg3);font-size:11px;padding:2px 14px 8px}
.wm-foot{border-top:1px solid var(--border);padding:8px 14px;display:flex;flex-direction:column;gap:5px}
#wm-import{background:var(--accent);color:#fff;border:none;border-radius:6px;
  padding:7px;font-size:12px;font-weight:600;cursor:pointer}
#wm-import:disabled{opacity:.5;cursor:wait}
#wm-status{font-size:11px;min-height:14px;color:var(--fg2)}
#wm-status.error{color:#f87171}
#wm-status.success{color:#4ade80}
#wm-status .wm-ow{margin-left:6px;padding:2px 10px;border-radius:4px;border:1px solid var(--border);
  background:var(--bg3);color:var(--fg);font-size:11px;cursor:pointer}
#wm-status .wm-ow:hover{border-color:var(--fg3)}
#wm-status .wm-ow.danger{background:#7f1d1d;border-color:#b91c1c}
#wm-status .wm-ow.danger:hover{background:#991b1b}
/* App switch: standalone pill buttons (badge-bar style) — always visible */
.app-tabs{display:flex;gap:6px}
.app-tab{padding:2px 12px;border-radius:999px;font-size:11px;font-weight:600;
  color:var(--fg3);background:var(--bg3);border:1px solid var(--border);cursor:pointer;
  white-space:nowrap}
.app-tab:hover{color:var(--fg2);border-color:var(--fg3)}
.app-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* Control — ONE row, always: [max | drive pad | readouts] │ [look pad | readouts].
   nowrap by design — the pads shrink with BOTH the card height and the column
   width, so the two groups can never stack vertically. Fixed side content is
   kept minimal (tight paddings) so the pads get the space. */
#page-control{
  flex:0 0 auto;container-type:inline-size;overflow:hidden;
  display:flex;flex-wrap:nowrap;justify-content:center;
  align-items:center;padding:4px;
}
#page-control .cg{display:flex;align-items:center;gap:8px;padding:0 8px;flex-shrink:0}
#page-control .cg+.cg{border-left:1px solid var(--border)}
#page-control .ctrl-joystick-wrap{
  width:clamp(56px, 50cqw - 96px, 240px);
  height:clamp(56px, 50cqw - 96px, 240px);flex-shrink:0}
#page-control .ctrl-vslider{height:clamp(56px, 50cqw - 96px, 240px);width:20px}
/* Narrow column: collapse the readout columns and keep only the pads —
   control surface survives with no overlap and no wrapping. */
@container (max-width: 370px){
  #page-control .cg{padding:0 4px;gap:6px}
  #page-control .cg-side{display:none}
  #page-control .ctrl-joystick-wrap{
    width:clamp(56px, 50cqw - 40px, 240px);
    height:clamp(56px, 50cqw - 40px, 240px)}
  #page-control .ctrl-vslider{height:clamp(56px, 50cqw - 40px, 240px)}
}
.cg-side{display:flex;flex-direction:column;gap:6px;width:52px;flex-shrink:0}
.cg-title{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--fg2)}
.cg-read{font-size:10px;color:var(--fg3);line-height:1.3}
.cg-read strong{display:block;font-size:13px;color:var(--fg);font-weight:600;
  font-variant-numeric:tabular-nums}

/* No visual "focused card" treatment — the shield below still gates
   iframe interaction, it just doesn't repaint the card. */

/* Click-to-interact shield: iframes swallow wheel events, so an inactive
   card is covered by this transparent layer — wheel over it scrolls the
   stack, a click hands focus (and the pointer) to the iframe below */
.sp-shield{position:absolute;inset:0;z-index:4;cursor:pointer;transition:background .15s}
.sp-shield:hover{background:rgba(255,255,255,.04)}
.stack-panel.focused .sp-shield{display:none}


/* ── Divider ── */
.divider{
  width:6px;cursor:col-resize;background:#3a3055;   /* 어두운 보라 — hover 시 accent */
  flex-shrink:0;position:relative;z-index:10;transition:background .15s;
}
.divider:hover,.divider.dragging{background:var(--accent)}

/* ── Right sensor column (inline panel, fixed type sizes) ── */
.right{display:flex;flex-direction:column;min-width:0;flex-shrink:0;background:var(--bg2)}
.right .panel{width:100%;min-width:0;flex:1;border-left:none}
.right .panel-section{padding:12px 8px}
.right .panel-section.panel-section-flush .panel-title{padding:0 8px}
.right .panel-title{font-size:14px;margin-bottom:8px;gap:8px}
.right .panel-title select{font-size:12px;border-radius:5px;padding:2px 4px}
.right .panel-row{font-size:14px;padding:4px 0}
.right .panel-value{font-size:14px}
.right .battery-bar{height:8px;border-radius:4px;margin-top:8px}
.right .panel-restart{padding:12px !important}
.right .btn-restart{font-size:13px;padding:8px 26px;border-radius:8px}
</style>
</head>
<body>

<!-- Sensors — 맨 좌측 컬럼 -->
<div class="right" id="right">
  <div class="panel" id="sensor-panel">
    <div class="panel-section panel-section-flush">
      <div class="panel-title">Camera
        <select id="cam-res" onchange="changeCameraRes()">
          <option value="480">360p</option>
          <option value="320" selected>240p</option>
          <option value="160">120p</option>
          <option value="off">Off</option>
        </select>
      </div>
      <img class="panel-camera panel-zoomable" id="p-camera" alt="Camera" onclick="openSensorModal('camera')" title="Click to enlarge">
    </div>
    <div class="panel-section panel-section-flush">
      <div class="panel-title">LiDAR
        <select id="lidar-range" onchange="changeLidarRange()">
          <option value="2">2m</option>
          <option value="4" selected>4m</option>
          <option value="8">8m</option>
          <option value="16">16m</option>
          <option value="off">Off</option>
        </select>
      </div>
      <canvas class="panel-lidar panel-zoomable" id="p-lidar" onclick="openSensorModal('lidar')" title="Click to enlarge"></canvas>
    </div>
    <div class="panel-section">
      <div class="panel-title">Velocity</div>
      <div class="panel-row"><span class="panel-label">Linear</span><span class="panel-value" id="p-linear">0.0 m/s</span></div>
      <div class="panel-row"><span class="panel-label">Angular</span><span class="panel-value" id="p-angular">0.0 rad/s</span></div>
    </div>
    <div class="panel-section">
      <div class="panel-title">Battery</div>
      <div class="panel-row">
        <span class="panel-value" id="p-battery">--%</span>
        <span class="panel-value" id="p-voltage">--V</span>
      </div>
      <div class="battery-bar"><div class="battery-fill" id="p-battery-fill" style="width:0%"></div></div>
    </div>
    <div class="panel-section panel-restart">
      <button class="btn-restart" id="btn-restart" onclick="restartContainer()">&#x21bb; Restart</button>
    </div>
  </div>
</div>

<div class="divider" id="divider"></div>

<div class="main" id="main">
  <div class="stack" id="stack">
    <!-- SIMULATOR 패널은 제거됨 — 클라우드 심에선 별도 sim.physicar 탭(독립 /sim 화면)이
         담당한다. 실물 차량과 동일한 앱 구성(MYAPP/VNC/CONTROL)으로 UI 통일. -->

    <!-- CONTROL card (control.js gates sending on #page-control.active) -->
    <div class="stack-panel on" id="panel-control">
      <div class="sp-head">CONTROL
        <div class="sp-actions" title="Keyboard: arrow keys drive"
             style="gap:4px;font-size:10px;color:var(--fg3);font-weight:600">&#8593;&#8595;&#8592;&#8594;&nbsp;keys</div>
      </div>
      <div class="ctrl-strip" id="page-control">
        <!-- Drive (speed / steering) -->
        <div class="cg">
          <div class="ctrl-vslider" title="Max speed (m/s)">
            <span class="ctrl-vslider-val"><strong id="ctrl-max-speed-val">0.5</strong></span>
            <input type="range" id="ctrl-max-speed" min="0.5" max="3.0" step="0.1" value="0.5" oninput="CTRL.setMaxSpeed(this.value)">
            <span class="ctrl-vslider-label">Max</span>
          </div>
          <div class="ctrl-joystick-wrap" id="ctrl-drive-joy">
            <canvas class="ctrl-joystick" id="ctrl-drive-canvas"></canvas>
          </div>
          <div class="cg-side">
            <div class="cg-title">DRIVE</div>
            <div class="cg-read">Speed<strong><span id="ctrl-speed">0.00</span> m/s</strong></div>
            <div class="cg-read">Steer<strong><span id="ctrl-steer">0</span>°</strong></div>
          </div>
        </div>

        <!-- Look (camera pan / tilt) -->
        <div class="cg">
          <div class="ctrl-joystick-wrap" id="ctrl-cam-joy">
            <canvas class="ctrl-joystick" id="ctrl-cam-canvas"></canvas>
          </div>
          <div class="cg-side">
            <div class="cg-title">LOOK</div>
            <div class="cg-read">Pan<strong><span id="ctrl-pan">0</span>°</strong></div>
            <div class="cg-read">Tilt<strong><span id="ctrl-tilt">0</span>°</strong></div>
          </div>
        </div>
      </div>
    </div>


    <!-- MYAPP -->
    <div class="stack-panel" id="panel-myapp">
      <div class="sp-head">
        <div class="app-tabs" role="tablist"></div>
        <div class="sp-actions">
          <button class="sp-btn" id="btn-reload-myapp" title="Reload">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          </button>
          <button class="sp-btn" id="btn-open-myapp" title="Open in new tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </button>
        </div>
      </div>
      <div class="sp-body"><iframe id="frame-myapp" title="MyApp" allow="autoplay; camera; microphone"></iframe><div class="sp-shield" data-frame="frame-myapp" title="Click to interact"></div></div>
    </div>

    <!-- VNC -->
    <div class="stack-panel" id="panel-vnc">
      <div class="sp-head">
        <div class="app-tabs" role="tablist"></div>
      </div>
      <div class="sp-body"><iframe id="frame-vnc" title="VNC" scrolling="no" allow="autoplay; camera; microphone"></iframe><div class="sp-shield" data-frame="frame-vnc" title="Click to interact"></div></div>
    </div>

  </div>
</div>

<div class="divider" id="divider2"></div>

<!-- Simulator (sim mode only): own header with the current-world chip,
     /sim embedded below it (its toolbar copy is hidden in embedded mode) -->
<div id="simcol">
  <div class="sp-head"><span>SIMULATOR</span>
    <button id="sim-world-btn" title="Select world">&hellip;</button></div>
  <div class="sim-body"><iframe id="frame-sim" title="Simulator" allow="autoplay"></iframe></div>
</div>

<!-- World modal: official/custom sections, inline delete confirm, import -->
<div class="sensor-modal-overlay" id="world-modal" style="display:none">
  <div class="sensor-modal">
    <div class="sensor-modal-header"><span>Worlds</span>
      <button class="sensor-modal-close" id="wm-close">&times;</button></div>
    <div class="wm-body">
      <div class="wm-sec">OFFICIAL WORLD</div>
      <div id="wm-official"></div>
      <div class="wm-sec">CUSTOM WORLD</div>
      <div id="wm-custom"></div>
    </div>
    <div class="wm-foot">
      <button id="wm-import">&#x2913; Import World (.tar.gz)</button>
      <div id="wm-status"></div>
      <input type="file" id="wm-file" accept=".tar.gz,.gz" style="display:none">
    </div>
  </div>
</div>

<script src="/static/js/core.js"></script>
<script src="/static/js/control.js"></script>
<script src="/static/js/sensors.js"></script>
<script>
(function(){
  'use strict';

  /* ── 레이아웃: [Control 고정 + 선택 앱] | 상태 | 시뮬레이터(sim 전용) ──
     Control 은 항상 표시(상단 고정), 그 아래는 셀렉트로 고른 앱 하나(My App/VNC).
     시뮬레이터는 우측 고정 컬럼 — 독립 /sim 화면(자체 툴바 포함)을 그대로 임베드. */
  const APPS = [
    { id: 'myapp', label: 'My App', path: '/myapp/' },
    { id: 'vnc',   label: 'VNC',    path: '/vnc/'   },
  ];
  const KEY = 'app-view';
  let simMode = false;
  let appId = 'myapp';
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && APPS.some(x => x.id === s.app)) appId = s.app;
    else if (s && Array.isArray(s.sel)) {            // 구 멀티선택 스키마 승계
      const hit = APPS.find(x => s.sel.includes(x.id)); if (hit) appId = hit.id;
    }
  } catch(e){}
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify({ app: appId })); }catch(e){} }

  const main    = document.getElementById('main');
  const right   = document.getElementById('right');
  const divider = document.getElementById('divider');
  const divider2= document.getElementById('divider2');
  const simcol  = document.getElementById('simcol');
  const ctrlCol = document.getElementById('page-control');
  const panels = {};
  const frames = {};
  APPS.forEach(x => {
    panels[x.id] = document.getElementById('panel-' + x.id);
    frames[x.id] = document.getElementById('frame-' + x.id);
  });
  // Segmented app buttons — one set per app card header, kept in sync
  document.querySelectorAll('.app-tabs').forEach(w => {
    APPS.forEach(x => {
      const b = document.createElement('button');
      b.className = 'app-tab'; b.dataset.app = x.id; b.textContent = x.label;
      b.addEventListener('click', () => { appId = x.id; save(); render(); });
      w.appendChild(b);
    });
  });
  const appTabs = Array.from(document.querySelectorAll('.app-tab'));

  // Open MyApp in a full browser tab. Inside the VS Code webview the iframe
  // sandbox blocks window.open (returns null) — relay to the extension
  // instead, which opens the system browser via openExternal.
  document.getElementById('btn-open-myapp').addEventListener('click', () => {
    // the session token reaches the new tab via the physicar_session cookie (no URL exposure)
    const url = new URL('/myapp/', location.href).href;
    let w = null;
    try { w = window.open(url, '_blank', 'noopener'); } catch(e){}
    if (!w && window.parent !== window) {
      window.parent.postMessage({ type: 'physicar-open', url }, '*');
    }
  });

  // Reload MyApp in place (same-origin → keeps the page it navigated to;
  // falls back to re-setting src if the frame is somehow inaccessible)
  document.getElementById('btn-reload-myapp').addEventListener('click', () => {
    const f = document.getElementById('frame-myapp');
    try { f.contentWindow.location.reload(); }
    catch(e) { f.src = f.getAttribute('src'); }
  });

  // MyApp liveness: the offline placeholder polls itself back to life, but a
  // RUNNING app that dies leaves its last page frozen in the iframe. The
  // server watches the port (/proc, no HTTP into the app) and pushes state
  // over the /states SSE stream — on the up -> down transition, reload the
  // frame so the placeholder (and its auto-reload) takes over right away.
  let myappWasUp = null;
  document.addEventListener('myapp-status', (e) => {
    const up = !!e.detail.up;
    // Reload on BOTH transitions: death swaps the placeholder in right away,
    // recovery replaces it without waiting out the placeholder's own backoff.
    if (myappWasUp !== null && up !== myappWasUp && appId === 'myapp') {
      const f = document.getElementById('frame-myapp');
      try { f.contentWindow.location.reload(); }
      catch(err) { f.src = '/myapp/'; }
    }
    myappWasUp = up;
  });

  function render(){
    ctrlCol.classList.add('active');      // CTRL 전송 게이트 (Control 카드는 상시 표시)
    appTabs.forEach(b => b.classList.toggle('active', b.dataset.app === appId));
    APPS.forEach(x => {
      const on = x.id === appId;
      panels[x.id].classList.toggle('on', on);
      // 표시 시 로드, 숨김 시 해제 (숨은 VNC 스트림 자원 회수 — 기존 프로파일 유지)
      const f = frames[x.id];
      const src = f.getAttribute('src');
      if (on) { if (src !== x.path) f.src = x.path; }
      else if (src && src !== 'about:blank') f.src = 'about:blank';
    });
    const sf = document.getElementById('frame-sim');
    if (simMode) { if (sf.getAttribute('src') !== '/sim/?embed') sf.src = '/sim/?embed'; }
    else if (sf.getAttribute('src') && sf.getAttribute('src') !== 'about:blank') sf.src = 'about:blank';
    updateFocus(true);
  }

  /* ── 3열 분할: [상태 | 앱 | 심] — 경계 두 개 모두 드래그 (세션 한정) ── */
  let b1 = 0.2, b2 = 1;                // real default: sensors 1 : center 4 (no sim column)
  function applyRatio(){
    right.style.width = 'calc(' + (b1 * 100).toFixed(2) + '% - 4px)';
    main.style.width  = 'calc(' + (((simMode ? b2 : 1) - b1) * 100).toFixed(2) + '% - 4px)';
    if (simMode) simcol.style.width = 'calc(' + ((1 - b2) * 100).toFixed(2) + '% - 4px)';
    main.style.flex = 'none'; right.style.flex = 'none';
  }

  function makeDrag(el, onMove){
    let dragging = false;
    function down(e){
      e.preventDefault(); dragging = true;
      el.classList.add('dragging');
      document.querySelectorAll('iframe').forEach(f => f.style.pointerEvents = 'none');
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
      document.addEventListener('touchmove', move, {passive:false});
      document.addEventListener('touchend', up);
    }
    function move(e){
      if(!dragging) return;
      e.preventDefault();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      onMove(cx, cy);
    }
    function up(){
      dragging = false;
      el.classList.remove('dragging');
      document.querySelectorAll('iframe').forEach(f => f.style.pointerEvents = '');
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      document.removeEventListener('touchmove', move);
      document.removeEventListener('touchend', up);
      // ratios are session-only by design — not saved
    }
    el.addEventListener('mousedown', down);
    el.addEventListener('touchstart', down, {passive:false});
  }

  // 경계1: 상태 | 앱 — 경계2와 최소 간격 유지
  makeDrag(divider, (cx) => {
    const hi = (simMode ? b2 : 1) - 0.2;
    b1 = Math.max(0.1, Math.min(hi, cx / document.body.clientWidth));
    applyRatio();
  });
  // 경계2: 앱 | 시뮬레이터 (sim 모드 전용)
  makeDrag(divider2, (cx) => {
    b2 = Math.max(b1 + 0.2, Math.min(0.9, cx / document.body.clientWidth));
    applyRatio();
  });

  /* ── Click-to-interact cards ──
     .focused on a panel = it owns the pointer/keyboard. For iframe cards
     that means shield hidden + accent border; when NO iframe is focused,
     the keyboard goes to the parent document — i.e. the inline CONTROL
     card — so that card glows instead. Tracked via an activeElement poll
     (cross-origin safe): clicking anywhere in the parent document pulls
     focus off the iframe, which re-arms its shield. */
  let lastFocused = null;
  // Focus moved → synthesize keyup for the arrows. Without this a key held
  // across a focus change never delivers its real keyup to the CONTROL
  // driver and the car keeps driving on a latched key.
  function releaseArrows(){
    ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].forEach(k =>
      document.dispatchEvent(new KeyboardEvent('keyup', { key: k })));
  }
  window.addEventListener('blur', releaseArrows);
  function updateFocus(force){
    const ae = document.activeElement;
    const target = (ae && ae.tagName === 'IFRAME') ? ae : null;
    // The compare key includes non-iframe activeElements too, so moving
    // between header controls is also detected
    const key = target || ae;
    const changed = key !== lastFocused;
    if (!force && !changed) return;
    lastFocused = key;
    if (changed) releaseArrows();
    document.querySelectorAll('.stack-panel.focused').forEach(el => el.classList.remove('focused'));
    if (target) {
      const holder = target.closest('.stack-panel');
      if (holder) holder.classList.add('focused');
    } else if (ae && ae.closest && ae.closest('.stack-panel')) {
      // A panel-header control (app select 등) is in use — keep that panel lit
      ae.closest('.stack-panel').classList.add('focused');
    }
  }
  setInterval(() => updateFocus(false), 250);

  document.querySelectorAll('.sp-shield').forEach(sh => {
    sh.addEventListener('click', () => {
      const f = document.getElementById(sh.dataset.frame);
      if (f) f.focus();
      updateFocus(true);   // immediate — don't wait for the poll tick
    });
  });

  // Card header strip also activates its card (control: the click itself
  // already pulled focus off any iframe — just refresh immediately)
  document.querySelectorAll('.stack-panel').forEach(p => {
    p.querySelector('.sp-head').addEventListener('click', (e) => {
      if (e.target.closest('.sp-actions') || e.target.closest('.app-tabs')) return;   // header controls
      const f = p.querySelector('.sp-body iframe');
      if (f) f.focus();
      updateFocus(true);
    });
  });

  /* Sim iframe keyboard passthrough: clicking the 3D view moves keyboard
     focus INTO the same-origin sim frame, where this document's CONTROL key
     driver can't hear it. Capture the arrows inside the frame, re-dispatch
     them here, and stop them locally (capture phase — also keeps the
     viewer's own arrow-pan from fighting the drive). Result: arrow driving
     works wherever the user last clicked in app.physicar. MyApp/VNC frames
     are deliberately NOT forwarded — focused there, the keyboard belongs to
     the student's app. */
  const simFrame = document.getElementById('frame-sim');
  simFrame.addEventListener('load', () => {
    let doc = null;
    try { doc = simFrame.contentDocument; } catch (e) { return; }   // cross-origin guard
    if (!doc) return;
    ['keydown', 'keyup'].forEach(type => {
      doc.addEventListener(type, (e) => {
        if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;
        e.preventDefault(); e.stopPropagation();
        document.dispatchEvent(new KeyboardEvent(type, { key: e.key, code: e.code }));
      }, true);
    });
  });

  /* ── Control (inline) ── */
  CTRL.init();
  const redrawJoysticks = () => { CTRL._drawJoystick('drive'); CTRL._drawJoystick('cam'); };
  requestAnimationFrame(redrawJoysticks);
  // Redraw whenever the control column changes size (window resize, divider drag)
  new ResizeObserver(() => requestAnimationFrame(redrawJoysticks))
    .observe(document.getElementById('page-control'));

  /* ── Sensors (inline) ── */
  ['cam-res', 'lidar-range'].forEach(id => {
    const v = localStorage.getItem(id);
    if (v && $(id)) $(id).value = v;
  });
  startStateStream();
  startLidarStream();
  startCameraStream();

  /* ── World selector (sim mode): header chip + full-cover modal ── */
  function initSimWorldUI(){
    const btn = document.getElementById('sim-world-btn');
    const modal = document.getElementById('world-modal');
    const st = document.getElementById('wm-status');
    const impBtn = document.getElementById('wm-import');
    const fileIn = document.getElementById('wm-file');
    const setSt = (m, c) => { st.textContent = m || ''; st.className = c || ''; };
    let worlds = [], current = null;

    const post = (path, body) => fetch('/sim/api' + path, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body) }).then(r => r.json());

    function renderRows(){
      const official = document.getElementById('wm-official');
      const custom = document.getElementById('wm-custom');
      official.innerHTML = ''; custom.innerHTML = '';
      worlds.forEach(w => {
        const isCurrent = w.name === current;
        const row = document.createElement('div');
        row.className = 'wm-row' + (isCurrent ? ' active' : '');
        const name = document.createElement('span');
        name.className = 'wm-name';
        name.textContent = (isCurrent ? '✓ ' : '') + w.name;
        row.appendChild(name);
        row.onclick = () => { if (!isCurrent) switchWorld(w.file); };
        if (w.deletable) {
          const del = document.createElement('span');
          del.className = 'wm-del'; del.innerHTML = '&#x1f5d1;';
          del.title = 'Delete ' + w.name;
          // Inline confirm — window.confirm is silently dropped in webviews
          del.onclick = (e) => {
            e.stopPropagation();
            row.onclick = null; del.remove();
            const c = document.createElement('span');
            c.className = 'wm-confirm'; c.textContent = 'Delete?';
            const yes = document.createElement('button');
            yes.className = 'wm-yes'; yes.textContent = '✓';
            yes.onclick = (e2) => { e2.stopPropagation(); doDelete(w.name); };
            const no = document.createElement('button');
            no.className = 'wm-no'; no.textContent = '✕';
            no.onclick = (e2) => { e2.stopPropagation(); renderRows(); };
            c.appendChild(yes); c.appendChild(no);
            row.appendChild(c);
          };
          row.appendChild(del);
        }
        (w.name.startsWith('custom_') ? custom : official).appendChild(row);
      });
      if (!custom.children.length) {
        const empty = document.createElement('div');
        empty.className = 'wm-empty';
        empty.textContent = 'No custom worlds yet — import one below.';
        custom.appendChild(empty);
      }
    }

    async function refresh(force){
      // The periodic poll must not wipe an in-progress inline delete confirm;
      // explicit refreshes (open/delete/switch) always re-render.
      if (!force && modal.style.display !== 'none' && modal.querySelector('.wm-confirm')) return;
      try {
        const d = await (await fetch('/sim/api/worlds')).json();
        worlds = d.worlds; current = d.current;
        btn.textContent = current || '…';
        renderRows();
      } catch(e) {}
    }

    function switchWorld(worldFile){
      const target = worldFile.replace(/\.world$/, '');
      btn.textContent = target; current = target;
      close();
      // The embedded /sim viewer follows the server switch via SSE — no reload.
      post('/switch', { world: worldFile }).catch(() => {});
      setTimeout(() => refresh(true), 5000);
    }

    async function doDelete(name){
      setSt('Deleting ' + name + '...');
      try {
        const d = await (await fetch('/sim/api/worlds/' + name, { method: 'DELETE' })).json();
        if (!d.ok) throw new Error(d.error || 'Delete failed');
        setSt('Deleted ' + name + '.', 'success');
      } catch(e) { setSt(e.message, 'error'); }
      refresh(true);
    }

    async function upload(file){
      if (!file) return;
      if (!file.name.endsWith('.tar.gz')) { setSt('File must be .tar.gz', 'error'); return; }
      impBtn.disabled = true;
      let uploadId = null;
      try {
        setSt('Uploading ' + file.name + '...');
        const init = await post('/upload/init', { filename: file.name, size: file.size });
        if (!init.ok) throw new Error(init.error || 'Init failed');
        uploadId = init.upload_id;
        const CH = 10 * 1024 * 1024, total = Math.ceil(file.size / CH);
        let done = 0;
        await Promise.all(Array.from({ length: total }, async (_, i) => {
          const buf = await file.slice(i * CH, Math.min((i + 1) * CH, file.size)).arrayBuffer();
          let bin = '';
          new Uint8Array(buf).forEach(b => { bin += String.fromCharCode(b); });
          const d = await post('/upload/chunk', { upload_id: uploadId, chunk_index: i, data: btoa(bin) });
          if (!d.ok) throw new Error(d.error || 'Chunk upload failed');
          done++; setSt('Uploading ' + file.name + '... ' + Math.round(done / total * 100) + '%');
        }));
        setSt('Processing...');
        const res = await post('/upload/complete', { upload_id: uploadId });
        if (!res.ok) {
          if (res.error === 'exists') {
            // Server kept the session — confirm before replacing, no re-upload
            owConfirm(res.world, uploadId);
            uploadId = null;   // keep the catch from cancelling the kept session
            return;
          }
          throw new Error(res.error || 'Upload failed');
        }
        setSt('World "' + res.world + '" uploaded!', 'success');
        await refresh(true);
        setTimeout(() => switchWorld(res.world + '.world'), 1200);
      } catch(e) {
        setSt('Upload failed: ' + e.message, 'error');
        if (uploadId) post('/upload/cancel', { upload_id: uploadId }).catch(() => {});
      } finally { impBtn.disabled = false; }
    }

    // Inline overwrite confirm (native confirm() is dropped in webviews)
    function owConfirm(world, uploadId){
      st.className = ''; st.textContent = '';
      const span = document.createElement('span');
      span.textContent = 'World "' + world + '" already exists. Replace it?';
      const rep = document.createElement('button');
      rep.className = 'wm-ow danger'; rep.textContent = 'Replace';
      const can = document.createElement('button');
      can.className = 'wm-ow'; can.textContent = 'Cancel';
      st.append(span, rep, can);
      rep.onclick = async () => {
        setSt('Processing...');
        try {
          const res = await post('/upload/complete', { upload_id: uploadId, overwrite: true });
          if (!res.ok) throw new Error(res.error || 'Upload failed');
          setSt('World "' + res.world + '" replaced!', 'success');
          await refresh(true);
          setTimeout(() => switchWorld(res.world + '.world'), 1200);
        } catch(e) { setSt('Upload failed: ' + e.message, 'error'); }
      };
      can.onclick = () => {
        post('/upload/cancel', { upload_id: uploadId }).catch(() => {});
        setSt('Import cancelled.');
      };
    }

    function open(){ setSt(''); refresh(true); modal.style.display = 'flex'; }
    function close(){ modal.style.display = 'none'; fileIn.value = ''; }
    btn.addEventListener('click', open);
    document.getElementById('wm-close').addEventListener('click', close);
    modal.addEventListener('click', (e) => { if (e.target === modal) close(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.style.display !== 'none') close();
    });
    impBtn.addEventListener('click', () => fileIn.click());
    fileIn.addEventListener('change', () => {
      const f = fileIn.files[0];
      fileIn.value = '';   // same file re-selectable after a cancel
      upload(f);
    });

    refresh();
    setInterval(() => { if (!document.hidden) refresh(); }, 10000);
  }

  /* ── Mode: 시뮬레이터 컬럼은 sim 모드에서만 열린다 ── */
  (async function(){
    const mode = await detectMode();   // adds body.sim-mode when sim
    if (mode === 'sim') {
      simMode = true;
      document.title = 'PHYSICAR App (SIM)';
      b1 = 1/6; b2 = 0.5;              // sensors 1 : center 2 : sim 3
      initSimWorldUI();
    }
    render(); applyRatio();
  })();

  render();
  applyRatio();
})();
</script>
</body>
</html>
