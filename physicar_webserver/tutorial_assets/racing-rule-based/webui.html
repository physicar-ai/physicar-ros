<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rule-Based</title>
<style>
  /* the whole page IS the 4:3 stage — it fills whatever frame shows it
     (the MYAPP tab and the tutorial iframe are both 4:3) */
  html, body { margin: 0; height: 100%; background: #0d0d10; color: #cfcfe2;
               font-family: system-ui, sans-serif; overflow: hidden; }
  .stage { position: absolute; inset: 0; }
  .stage img { width: 100%; height: 100%; object-fit: cover; display: block;
               background: #0c0c12; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%;
                  display: block; pointer-events: none; }
  .marker { position: absolute; top: 0; height: 100%; width: 2px;
            background: rgba(239,68,68,.55); display: none; pointer-events: none; }
  .crop { position: absolute; top: 0; left: 0; right: 0; height: 0;
          background: rgba(255,255,255,.06);
          border-bottom: 1.5px dashed rgba(255,255,255,.55); pointer-events: none; }
  /* in the cropped (empty) top zone; scales with the frame width */
  .status { position: absolute; left: 0; right: 0; top: 6px; text-align: center;
            font-size: clamp(8px, 5vw, 13.5px); color: #b9b9cc;
            font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden;
            text-shadow: 0 1px 3px rgba(0,0,0,.9); }
  .status.lost { color: #f87171; font-weight: 600; }
</style>
</head>
<body>
  <div class="stage">
    <img id="mask" alt="">
    <i class="crop" id="crop"></i>
    <i class="marker" id="marker"></i>
    <canvas id="cv"></canvas>
    <div class="status" id="status">not running</div>
  </div>
<script>
(function () {
  "use strict";
  var mask = document.getElementById("mask"), marker = document.getElementById("marker"),
      status = document.getElementById("status"), cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var target = null, disp = null;

  function draw(d) {
    var r = cv.getBoundingClientRect();
    var w = Math.round(r.width), h = Math.round(r.height);
    if (w < 10 || h < 10) { return; }
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    // full-width semicircle: radius = half the frame width (4:2 inside 4:3)
    var cx = w / 2, cy = h - 2, maxR = Math.min(w / 2 - 2, h - 8);
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.arc(cx, cy, maxR, Math.PI, 0); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, maxR / 2, Math.PI, 0); ctx.stroke();
    ctx.setLineDash([]);
    if (!d) { return; }
    var a = -Math.PI / 2 - (d.steering * 2 * Math.PI / 180);
    var len = Math.max(maxR * 0.92, 12);
    var ex = cx + Math.cos(a) * len, ey = cy + Math.sin(a) * len;
    var hl = 15;
    // shaft + head as ONE path, ONE stroke — translucent color must not
    // double up where the segments meet
    ctx.beginPath();
    ctx.moveTo(cx, cy); ctx.lineTo(ex, ey);
    ctx.moveTo(ex, ey); ctx.lineTo(ex - hl * Math.cos(a - 0.45), ey - hl * Math.sin(a - 0.45));
    ctx.moveTo(ex, ey); ctx.lineTo(ex - hl * Math.cos(a + 0.45), ey - hl * Math.sin(a + 0.45));
    ctx.strokeStyle = "rgba(239,68,68,.55)"; ctx.lineWidth = 6; ctx.lineCap = "round";
    ctx.stroke();
  }

  function tick() {
    if (target) {
      if (!disp) { disp = { steering: target.steering }; }
      disp.steering += (target.steering - disp.steering) * 0.3;
      draw(disp);
    } else if (disp) {
      disp = null;
      draw(null);
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // the crop-top guide follows the settings, live like everything else
  var crop = document.getElementById("crop");
  function syncCrop() {
    fetch("/tutorial/api/rb/settings").then(function (r) { return r.json(); })
      .then(function (st) { crop.style.height = ((st.crop || 0) * 100) + "%"; })
      .catch(function () {});
  }
  syncCrop();
  new EventSource("/tutorial/api/sl/events").onmessage = syncCrop;

  var es = new EventSource("/tutorial/api/run/events");
  es.onmessage = function (ev) {
    var m = {};
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    var live = m.running && m.job === "rb-run";
    var d = live ? m.rb : null;
    target = d;
    if (d) {
      var deg = (d.steering >= 0 ? "+" : "") + d.steering.toFixed(1) + "°";
      status.textContent = d.found ? "steering " + deg : "line lost · " + deg;
      status.classList.toggle("lost", !d.found);
    } else {
      status.textContent = live ? "" : "not running";
      status.classList.remove("lost");
    }
    marker.style.display = (d && d.found) ? "block" : "none";
    if (d && d.found) { marker.style.left = ((d.offset + 1) / 2 * 100) + "%"; }
    if (live && m.rb_img && m.rb_img.mask) {
      mask.src = "data:image/jpeg;base64," + m.rb_img.mask;
    }
  };
}());
</script>
</body>
</html>
